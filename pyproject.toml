[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-tools-setup"
version = "0.3.0"
description = "One-command installer for the jev-tools Claude Code plugin: pick the OpenJev (Codiv) API, a local model, or offline mode."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rcidshacker", email = "ruchitdas36@gmail.com" }]
dependencies = []
classifiers = ["Environment :: Console", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]

keywords = ["claude-code", "openjev", "codiv", "plugin", "installer"]

[project.urls]
Homepage = "https://github.com/Rcidshacker/jev-tools"
Issues = "https://github.com/Rcidshacker/jev-tools/issues"
Changelog = "https://github.com/Rcidshacker/jev-tools/blob/main/CHANGELOG.md"

[project.scripts]
jev-tools-setup = "jev_tools_cli:main"

[tool.setuptools]
py-modules = ["jev_tools_cli", "jev_report"]
package-dir = { "" = "installer" }
